name: Build Workload

on:
  push:
    branches:
    - main
    paths:
    - 'workload/**'
    - '.github/workflows/**'
  pull_request:
    branches: [ main ]
    paths:
    - 'workload/**'
    - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Pre-release tag name'
        required: true

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Authenticate GitHub Packages NuGet source
      run: |
        dotnet nuget update source github \
          --username github-actions \
          --password ${{ secrets.GITHUB_TOKEN }} \
          --store-password-in-clear-text \
          --configfile workload/NuGet.config

    - name: Build
      env:
        PULLREQUEST_ID: ${{ github.event.number }}
        PRERELEASE_TAG: ${{ github.event.inputs.prerelease }}
      run: make test
      working-directory: ./workload

    # CI packages are kept as a run artifact only. Release builds are published to
    # nuget.org by release-workload.yml; nothing consumes the CI builds from GitHub
    # Packages, and the former `deploy` job that pushed them there had been failing on
    # every push to main since the token was scoped to `packages: read`.
    - uses: actions/upload-artifact@v4
      with:
        name: tizen-workload-pkgs
        path: ./workload/out/nuget-unsigned/*.nupkg
